<!DOCTYPE html>
<html>
<head>
    <title>Adama Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Adama Library 📚</h1>
</header>

<div class="container">

    <!-- Navigation Buttons -->
    <button onclick="window.location.href='login.html'">Login</button>
    <button onclick="window.location.href='register.html'">Register</button>

    <h2>Welcome to our Digital Library</h2>
    <p>Click the button to view subjects</p>

    <button onclick="showBooks()">View Subjects</button>

    <div id="books" style="margin-top:20px;"></div>

</div>

<script>
function showBooks() {
    document.getElementById("books").innerHTML =
        "🧪 Chemistry<br>" +
        "🧲 Physics<br>" +
        "🧬 Biology<br>" +
        "💻 Computer Studies<br>" +
        "📖 English<br>" +
        "📐 Mathematics<br>" +
        "🌍 Geography<br>" +
        "🤝 Life Skills<br>" +
        "🇲🇼 Chichewa<br>" +
        "💡 Social Studies<br>" +
        "⏳ History";
}
</script>

</body>
</html>
